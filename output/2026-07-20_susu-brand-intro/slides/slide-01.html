<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;background:#F7F2EC;font-family:'Pretendard Variable','Pretendard',sans-serif;color:#6E1A2B;overflow:hidden;position:relative;-webkit-font-smoothing:antialiased}
  body::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 80% at 78% 8%, rgba(200,151,58,0.06), transparent 55%);pointer-events:none}
  .label{font-size:25px;font-weight:700;letter-spacing:0.16em;color:#A83848}
  .bar{width:64px;height:5px;background:#C8973A;border-radius:3px}
  .sub{color:rgba(110,26,43,0.55);line-height:1.6}
</style>
</head>
<body>
  <div style="position:absolute;top:96px;left:90px;display:flex;align-items:center;gap:14px">
    
<svg width="36" height="36" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="20" cy="20" r="13" fill="#C8973A" fill-opacity="0.9"/>
  <circle cx="20" cy="20" r="13" stroke="#C8973A" stroke-width="1.2"/>
  <path d="M20 7 L20 33 M7 20 L33 20 M11 11 L29 29 M29 11 L11 29" stroke="#F7F2EC" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="16" cy="16" r="3" fill="#FFFFFF" fill-opacity="0.5"/>
</svg><span style="font-size:27px;font-weight:800;letter-spacing:0.28em;color:#6E1A2B">SUSU</span>
  </div>
  <div style="position:absolute;top:110px;right:90px;font-size:21px;letter-spacing:0.14em;color:rgba(110,26,43,0.55)">사주 오행 공방</div>

  <div style="position:absolute;bottom:150px;left:90px;right:90px">
    <div class="label" style="margin-bottom:34px">수수 · 첫인사</div>
    <div style="font-size:88px;font-weight:800;line-height:1.2;letter-spacing:-0.035em;word-break:keep-all">
      당신의 오행을 담은<br/><span style="color:#A83848">단 하나의 팔찌</span>
    </div>
    <div class="bar" style="margin-top:42px"></div>
    <div class="sub" style="margin-top:32px;font-size:30px">사주로 만드는 원석 팔찌, 수수를 소개합니다.</div>
  </div>
  <div style="position:absolute;bottom:74px;right:90px;font-size:22px;color:#C8973A;font-weight:600;letter-spacing:0.04em">저장 필수 ✦</div>
</body></html>
